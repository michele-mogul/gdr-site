name: Anteprima su GitHub Pages

# Builds the site on every push to main and publishes it to
# https://michele-mogul.github.io/gdr-site/ so the result can be looked at
# before a real domain exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older, still-running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` is `astro check && astro build`: a malformed content
      # file or a type error fails here instead of shipping.
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://michele-mogul.github.io
          BASE_PATH: /gdr-site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
